[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra"
version = "0.2.0"
description = "Unified pipeline: MASt3R-SfM 3D reconstruction (Vision) + HSI→Mesh registration."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SpectraBreast" }]
# Core: config, CLI, Mufasa hand-off, Rerun viewers. Enough on the robot PC
# when vision / registration run on Mufasa (mufasa.enabled: true).
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pyaml>=25.0",
    "pydantic>=2.8",
    "typer>=0.12",
    "rich>=13.0",
    "opencv-contrib-python>=4.8",
    "rerun-sdk>=0.30",
    "paramiko>=5.0.0",
    "pip>=26.1.2",
]

[project.optional-dependencies]
# Robot PC: RealSense + collision checks (spectra acquire, acquisition stage).
acquisition = [
    "pyrealsense2>=2.59.1.11053",
    "python-fcl>=0.7.0.11",
    "trimesh>=4.0",
]
# Vision + registration on THIS machine: Mufasa / GPU servers, and the robot PC
# only when mufasa.enabled is false. MASt3R + ASMK are installed on top (§1.3).
processing = [
    "scipy>=1.11",
    "tqdm>=4.66",
    "trimesh>=4.0",
    "rtree>=1.0",
    "pillow>=10.0",
    "einops>=0.8",
    "gradio>=6.0",
    "huggingface-hub>=0.20",
    "jaxtyping>=0.3",
    "open3d>=0.19",
    "roma>=1.5",
    "safetensors>=0.4",
    "torch>=2.2",
    "torchvision>=0.17",
    "openpyxl>=3.1",
]
gpu-raycast = ["cupy-cuda12x>=12.0"]

[project.scripts]
spectra = "spectra.cli:main"

[tool.setuptools]
packages = [
    "spectra",
    "spectra.vision",
    "spectra.vision.backends",
    "spectra.registration",
    "spectra.calibration",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130" }
]
torchvision = [
  { index = "pytorch-cu130" }
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
