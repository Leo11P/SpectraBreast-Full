[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra"
version = "0.2.0"
description = "Unified pipeline: 3D reconstruction with a choice of model (Vision) + HSI→Mesh registration."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SpectraBreast" }]
# Core: config, CLI, Mufasa hand-off, Rerun viewers. Enough on the robot PC
# when vision / registration run on Mufasa (mufasa.enabled: true).
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pyaml>=25.0",
    "pydantic>=2.8",
    "typer>=0.12",
    "rich>=13.0",
    "opencv-contrib-python>=4.8",
    "rerun-sdk>=0.30",
    "paramiko>=5.0.0",
    "openpyxl>=3.1",
    "pip>=26.1.2",
]

[project.optional-dependencies]
# Robot PC: camera SDKs + collision checks (spectra acquire, acquisition stage).
# vmbpy drives the Prosilica GC1020C (acquisition.camera.type: gc1020c) and also
# needs Vimba X installed on the PC (GigE transport layer, README §1.7).
acquisition = [
    "pyrealsense2>=2.59.1.11053",
    "vmbpy>=1.2 ; sys_platform == 'win32' or sys_platform == 'linux'",
    "python-fcl>=0.7.0.11",
    "trimesh>=4.0",
]
# Vision + registration on THIS machine: Mufasa / GPU servers, and the robot PC
# only when mufasa.enabled is false. Model-independent: what a reconstruction
# model needs is in ITS extra below (one per vision.backend, see
# spectra/vision/backends/registry.py), installed on top of this one:
#     uv sync --extra processing --extra <model>
processing = [
    "scipy>=1.11",
    "tqdm>=4.66",
    "trimesh>=4.0",
    "rtree>=1.0",
    "pillow>=10.0",
    "gradio>=6.0",
    "huggingface-hub>=0.20",
    "open3d>=0.19",
    "torch>=2.2",
    "torchvision>=0.17",
]
# --- one extra per reconstruction model (vision.backend) ---------------------
# vision.backend: mast3r. The MASt3R / DUSt3R code is the clone in mast3r/
# (+ ASMK), installed by Setup_env.sh (README §1.2-1.5); these are the packages
# it needs that are not in `processing`.
mast3r = [
    "einops>=0.8",
    "jaxtyping>=0.3",
    "roma>=1.5",
    "safetensors>=0.4",
]
# vision.backend: vggt_omega (VGGT-Omega, facebookresearch/vggt-omega, FAIR
# Noncommercial Research License). Weights: gated Hugging Face repo
# facebook/VGGT-Omega (README §1.6). Pinned to a commit for reproducibility.
vggt-omega = [
    "vggt-omega @ git+https://github.com/facebookresearch/vggt-omega@48b23c8ce72c9a8fcf987f0d7f43d8e4870759f6",
    "einops>=0.8",
    "safetensors>=0.4",
]
# vision.backend: pi3 (Pi3 / Pi3X, github.com/yyfz/Pi3, BSD-3-Clause code).
# Weights: Hugging Face yyfz233/Pi3X, yyfz233/Pi3 (downloaded on first use).
pi3 = [
    "pi3 @ git+https://github.com/yyfz/Pi3@a65e87ee9fb84ee4fd7a15ff8d8a26d16119da99",
    "plyfile>=1.0",
    "safetensors>=0.4",
]
# vision.backend: da3 (Depth Anything 3, github.com/ByteDance-Seed/Depth-Anything-3,
# Apache-2.0 code; giant/nested weights CC BY-NC 4.0). It declares python<=3.13 (3.13.0): Python 3.10-3.12 here.
da3 = [
    "depth-anything-3 @ git+https://github.com/ByteDance-Seed/Depth-Anything-3@3d835ec1a5802d64a8b8b15f817a1ab54809bfe4 ; python_full_version < '3.13'",
]
# vision.backend: mapanything (github.com/facebookresearch/map-anything,
# Apache-2.0 code; weights facebook/map-anything CC BY-NC 4.0 or
# facebook/map-anything-apache Apache 2.0).
mapanything = [
    "mapanything @ git+https://github.com/facebookresearch/map-anything@3d10cf7a3016fc0f9bb13a071ee66c47b10be0d9",
]
gpu-raycast = ["cupy-cuda12x>=12.0"]

[project.scripts]
spectra = "spectra.cli:main"

[tool.setuptools]
packages = [
    "spectra",
    "spectra.vision",
    "spectra.vision.backends",
    "spectra.registration",
    "spectra.calibration",
    "spectra.validation",
]

[tool.uv]
# Pins of the model packages that would break this environment:
# - numpy<2 (vggt-omega, depth-anything-3): the rest is on numpy 2, their code runs on it;
# - opencv-python / opencv-python-headless (vggt-omega, depth-anything-3,
#   mapanything): never installed, they clash with opencv-contrib-python
#   (cv2.aruco), see Setup_env.sh step 3b;
# - xformers (depth-anything-3): optional there, its wheels are tied to one
#   torch build;
# - rerun-sdk~=0.24 (mapanything): the pipeline needs >=0.30 (core dependency).
override-dependencies = [
    "numpy>=1.26",
    "opencv-python ; sys_platform == 'never'",
    "opencv-python-headless ; sys_platform == 'never'",
    "xformers ; sys_platform == 'never'",
    "rerun-sdk>=0.30",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130" }
]
torchvision = [
  { index = "pytorch-cu130" }
]
# pulled by mapanything (uniception): the build matching torch
torchaudio = [
  { index = "pytorch-cu130" }
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
