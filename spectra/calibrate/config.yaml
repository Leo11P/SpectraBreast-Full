# =============================================================================
#  config.yaml - single source of truth for the hand-eye pipeline
#  (Fairino FR5 + RealSense D456, manual drag-mode acquisition only)
#  Relative paths are resolved against the folder containing this file.
# =============================================================================

paths:
  calib_input_dir:  data/input/calibration    # imgXXXX.png + posaXXXX.txt (+ intrinsics_realsense.json)
  val_input_dir:    data/input/validation     # imgXXXX.png + posaXXXX.txt (NO intrinsics written here)
  calib_output_dir: data/output/calibration   # cam2gripper.txt, matrici_4x4.txt, gripper2base.txt, kept_images.txt, intrinsics_used.json
  intrinsics_output_dir: data/output/intrinsics  # intrinsics_opencv.json
  val_output_dir:   data/output/validation    # validation_report.csv, overlay_X/, overlay_Y/

# ------------------------------- chessboard ---------------------------------
board:
  chessboard_size: [7, 4]      # INNER corners (columns, rows)
  square_size_mm:  33.8        # physical square side (MEASURE IT!)

# ------------------------------- intrinsics ---------------------------------
# Which K, D are used by BOTH calibration and validation (same values for both):
#   realsense -> data/input/calibration/intrinsics_realsense.json (factory values,
#                written once by 'calibration acquire'; read from the live camera if missing)
#   opencv    -> data/output/intrinsics/intrinsics_opencv.json (run 'python main.py intrinsics')
#   file      -> any JSON {"K": 3x3, "D": [[k1,k2,p1,p2,k3]]} given in 'file' (e.g. converted from MATLAB)
intrinsics:
  source: opencv            # realsense | opencv | file
  file: null                   # used only when source = file
  min_views_warn: 10           # warning below this number of valid views (OpenCV calibration)

# ------------------------------ hand-eye ------------------------------------
calibration:
  handeye_method:    PARK      # PARK | TSAI | HORAUD | ANDREFF | DANIILIDIS
  outlier_sigma:     0.5       # outlier threshold: median + sigma*std (lower = stricter)
  max_reproj_err_px: 0.4       # views with mean PnP reprojection error above this are EXCLUDED
  euler_order:       ZYX       # Fairino convention: R = Rz@Ry@Rx
  only_images: []              # optional subset of image names (e.g. ["img0001.png"]); empty = all

# ------------------------- drag-mode acquisition ----------------------------
acquisition:
  robot_ip: "192.168.58.2"
  expected_tool: 0             # poses are read with GetActualTCPPose -> active tool MUST be 0 (bare flange)
  n_calib_target: 30           # stop after this many saved views (rerun to add more: numbering continues)
  n_val_target:   20
  preview_margin_px: 60        # guide rectangle in the live preview

# -------------------------------- validation --------------------------------
validation:
  save_overlay: true           # overlay observed (green) vs predicted (red) corners

# -------------------------------- realsense ---------------------------------
realsense:
  width: 1280
  height: 800
  fps: 15
  frame_timeout_ms: 10000
  auto_exposure: false         # false = manual exposure/gain (stable corners between frames)
  exposure: 120
  gain: 16
  auto_white_balance: true     # set false ONLY together with a tuned white_balance
  white_balance: null          # kelvin, used only if auto_white_balance = false
  n_avg_frames: 5              # average N frames at capture (robot still)
