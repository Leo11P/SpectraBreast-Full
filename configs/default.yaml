# =============================================================================
# SPECTRA — UNIFIED CONFIG (vision + registration)
# =============================================================================
# LAYOUT CONVENTION
#
#   Inputs — stage first, sample second. Identical for every registration
#   mode, batch included.
#
#     DATA/
#       input_vision/<sample>[_<device>]/    e.g. SB021_iphone, SB021_realsense
#         rgb/                               images (or directly in the folder)
#         poses/                             optional — pose_0000.txt, ...
#         camera_parameters/                 optional — intrinsics.npy, ...
#       input_registration/<sample>/
#         <sample>_raw.hdr                   ENVI cube (+ its .img/.raw)
#         <sample>_raw.png                   ROI mode only
#
#   When several `<sample>_*` vision folders exist, the suffix containing
#   "iphone" wins; otherwise the first alphabetically.
#
#   Outputs — grouped by run date, then by sample.
#
#     RESULTS/<dd-mm-yyyy>/<sample>/vision/
#     RESULTS/<dd-mm-yyyy>/<sample>/registration/
#     RESULTS/<dd-mm-yyyy>/_batch/batch_summary.xlsx
#
#   Camera calibration (`spectra calibrate`, robot PC) — fixed layout.
#
#     DATA/camera_calibration/
#       input/{calibration,validation}/      imgXXXX.png + posaXXXX.txt
#       output/{calibration,intrinsics,validation}/
#
#   Re-running any command on the same day OVERWRITES that day's stage folder.
#
# ABSOLUTE PATHS
#
#   Every path below is auto-derived from `sample_name` while it is `null`.
#   Set any of them — relative or absolute — and that value is used verbatim
#   and never rewritten. The convention is a default, not a constraint.
#
# UNITS
#
#   Marker lengths are in MILLIMETRES everywhere. Render resolutions are in
#   mm/px. The 3D pipeline works internally in metres and converts at the
#   boundary.
# =============================================================================




# Sample being processed. Drives every auto-derived path — spell it exactly as
# the folder names under DATA/.
sample_name: "SAMPLE2"

# Roots that drive default path resolution. Relative (from cwd) or absolute.
data_root:    "DATA"
results_root: "RESULTS"

# Run-date folder inserted between results_root and sample_name, dd-mm-yyyy.
# null = today. Pin an earlier date to run registration against that day's
# vision outputs.
results_date: null

# Which stage(s) `spectra full` runs, in this order:
#   acquisition  : robot + RealSense, always on THIS PC (`acquisition:` section)
#   vision       : MASt3R-SfM + ArUco ─┐ on this PC, or on Mufasa when
#   registration : HSI → mesh          ─┘ mufasa.enabled is true (see below)
# Drop "acquisition" to re-run vision/registration on a sample already acquired
# (or: --set stages=[vision,registration]). The standalone sub-commands
# `spectra vision` and `spectra registration` ignore this list.
stages: ["acquisition", "vision", "registration"]




# =============================================================================
# MUFASA (BioHPC cluster, SLURM) — where vision and registration run
# =============================================================================
# enabled: true  → `spectra vision`, `spectra registration` and the vision /
#                  registration stages of `spectra full` do NOT run on this PC:
#                  a SLURM job runs them on a GPU node of Mufasa.
# enabled: false → everything runs on this PC (vision needs a CUDA GPU).
# The acquisition always runs on this PC (robot and camera are local), and
# every job is launched from here with this config.
# On Mufasa everything lives in repo_dir, same layout as here:
#   <repo_dir>/DATA/input_{vision,registration}/<sample>/   inputs, by sample name:
#       only what is missing or changed is uploaded; an HSI cube already on
#       Mufasa is used even if it is not on this PC
#   <repo_dir>/RESULTS/<dd-mm-yyyy>/<sample>/{vision,registration,_job}/
# Only pull_patterns come back here (RESULTS/<dd-mm-yyyy>/<sample>/).
# Needs: this PC on the Polimi LAN/VPN, an SSH key on Mufasa, `paramiko`.
mufasa:
  enabled: true
  host: "10.79.23.96"                # Mufasa login server
  port: 22
  user: "lpassoni"
  ssh_key_path: 'C:\Users\leolu\.ssh\id_spectra_mufasa'   # null = ask for the password
  repo_dir: "/home/lpassoni/SpectraBreast-Full"    # cloned + Setup_env.sh done
  # dir with sbatch/squeue/sacct (non-interactive SSH does not load it): `which sbatch`
  slurm_bin_dirs: ["/opt/shared/sw/amd/gcc-13.3.0/slurm-25.05.4/bin"]
  partition: jobs
  qos: gpuwide                       # QOS have MaxSubmit=1: one job at a time
  gres: "gpu:4g.20gb:1"              # must match the QOS GPU type
  cpus: 8
  mem: 64G
  time: "12:00:00"
  job_name: spectra
  wait: true                         # wait for the job to finish ...
  poll_s: 20
  pull_results: true                 # ... and download pull_patterns:
  pull_patterns:                     # relative to RESULTS/<dd-mm-yyyy>/<sample>/
    - "registration/*.xlsx"          # error / timing reports
    - "registration/*.rrd"           # spectral point cloud for Rerun (registration.rerun)
    - "registration/*.rbl"           # its layout





# =============================================================================
# ACQUISITION (Fairino FR5 + RealSense, visual servoing)
# =============================================================================
# Used only by the acquisition (`spectra acquire`, the "acquisition" stage of
# `spectra full`, `python spectra/acquisition/acquire.py`), always on the robot
# PC. Vision and registration ignore this section.
#
# Output: written straight into the folder Vision reads from, i.e.
#   DATA/input_vision/<sample_name>/
#     rgb/img_0001.png ...            RGB (8-bit, BGR->PNG)
#     poses/pose_0001.txt ...         FLANGE pose in robot base: "x y z roll pitch yaw"
#                                     (metres, radians, R = Rz(yaw) Ry(pitch) Rx(roll))
#     camera_parameters/intrinsics.npy, distortions.npy, camera2ee.npy (hand-eye, metres),
#                       intrinsics_source.json (factory or override, see camera.intrinsics)
#     depth/, manifest.json, SHA256SUMS, _discarded/   (ignored by Vision)
#
# ArUco dictionary + marker edge length come from `vision.aruco` below: there
# is exactly ONE value for the whole pipeline.
acquisition:
  robot:
    ip: "192.168.58.2"
    tool: 0            # 0 = flangia nuda (la hand-eye e' riferita alla flangia)
    user: 0
    vel: 10           # velocita' movimenti di raggiungimento (%) — TIENILA BASSA
    dwell_s: 2.5       # sosta PRIMA DELLO SCATTO, solo DOPO che il servo ha
                       # confermato la posa centrata (riduce il motion blur)
    pointing_gate_deg: 15   # se alla 1a posa l'asse ottico e' oltre X deg dal
                            # centroide -> ABORT (catena non corretta)
    # Convenzione angoli [rx,ry,rz] del controller: 'AUTO' | 'XYZ' | 'ZYX'.
    # 'AUTO' e' inaffidabile vicino al gimbal lock (determinala con --verify).
    euler_order: ZYX

  camera:
    width: 1280
    height: 800
    fps: 10
    n_avg_frames: 5
    # Intrinsics used for solvePnP and saved into camera_parameters/.
    #   null (default): RealSense factory intrinsics of the running color stream
    #                   (always matching width/height).
    #   override      : a JSON with K and D, e.g. the output of
    #                   `spectra calibrate --modality intrinsics`:
    #                   DATA/camera_calibration/output/intrinsics/intrinsics_opencv.json
    #                   Relative to the cwd. Aborts if it is >5% off the factory
    #                   values (other resolution).
    intrinsics: null
    # MASTER depth: abilita lo STREAM depth della RealSense (allineato al color).
    # Ogni layer decide col proprio 'depth:' se salvare la mappa depth.
    depth: true

  hand_eye:
    # T_cam2gripper 4x4 (rotation + translation in mm).
    #   null      : the output of `spectra calibrate`,
    #               DATA/camera_calibration/output/calibration/cam2gripper.txt
    #   4x4 list  : used as written (e.g. to pin an older calibration)
    T_cam2gripper: null


  camera_box:
    # Ingombro fisico camera+adattatore (RealSense D456 + staffa): collisioni + viz.
    length_mm: 124.0
    width_mm: 26.0
    height_mm: 29.0
    support_extension_mm: 70.0
    collision_margin_mm: 5.0

  target:
    n_bootstrap_frames: 8      # frame aggregati (mediana per-marker) nel bootstrap

  visibility:
    margin_px: 40
    gimbal_lock_margin_deg: 8
    margin_px_proportional: true
    margin_ref_distance_mm: 150
    margin_px_min: 25
    margin_px_max: 180
    min_marker_coverage: 0.0   # 0 = disattivato (solo centroide)

  ik_retry:
    enable: true
    max_attempts: 24
    roll_step_deg: 15
    az_step_deg: 4
    tilt_step_deg: 4
    dist_frac: 0.06

  servo:                       # ricentraggio closed-loop a ogni posa
    enable: true
    pixel_tol: 40
    max_iters: 5
    vel: 15
    min_markers: 2
    damping: 0.6
    settle_before_detect_s: 0.4
    detect_retries: 4

  collision:
    enable: true
    floor_margin_mm: 5
    sample_tol_mm: [30, 30, 15]
    path_samples: 12
    validate_tol_mm: 5.0
    validate_tol_deg: 1.5
    validate_n_random: 8
    native_backstop: true
    native_level: [7, 7, 7, 7, 7, 7]
    native_strategy: 2
    # floor_per_link_mm: {shoulder_link: 40}
    # repo_dir: null            # default: spectra/acquisition (URDF/mesh/collision_fr5)

  viz:
    enable: true
    prelude_s: 5.0
    target_tol_mm: [30, 30, 15]
    poll_hz: 20
    frustum_len_m: 0.025
    memory_limit: "512MB"
    show_floor: true
    show_camera_frame: true
    show_collision_boxes: true
    camera_pinhole_distance_m: 0.06
    # repo_dir: null            # default: spectra/acquisition

  # tilt_deg: 0 = top-down, 90 = laterale. depth: salva o meno la depth per il layer.
  layers:
    - name: top_down
      distance_mm: 150
      tilt_deg: 20
      n_poses: 4
      azimuth_span_deg: 360
      azimuth_start_deg: 0
      roll_deg: 0
      depth: false

    - name: mid_oblique
      distance_mm: 120
      tilt_deg: 40
      n_poses: 6
      azimuth_span_deg: 360
      azimuth_start_deg: 20
      roll_deg: 0
      depth: false

    - name: close_frontal
      distance_mm: 100
      tilt_deg: 60
      n_poses: 15
      azimuth_span_deg: 360
      azimuth_start_deg: 0
      roll_deg: 0
      depth: false



# =============================================================================
# CALIBRATION (hand-eye camera -> flange + intrinsics, drag-mode views)
# =============================================================================
# `spectra calibrate` on the robot PC. Robot (ip, tool, euler_order) and camera
# stream (width, height, fps, n_avg_frames) come from `acquisition.robot` /
# `acquisition.camera`, so they are not repeated here. Data in
# DATA/camera_calibration/ (layout at the top of this file). The active tool on
# the controller must be acquisition.robot.tool (0 = bare flange).
calibration:
  board:
    chessboard_size: [7, 4]      # INNER corners (columns, rows)
    square_size_mm:  33.8        # physical square side (MEASURE IT!)

  # K, D used by BOTH hand-eye and validation:
  #   realsense -> input/calibration/intrinsics_realsense.json (factory values,
  #                written by the calibration acquisition, else read from the camera)
  #   opencv    -> output/intrinsics/intrinsics_opencv.json (`--modality intrinsics`)
  #   file      -> any JSON {"K": 3x3, "D": [[k1,k2,p1,p2,k3]]} given in `file`
  intrinsics:
    source: opencv               # realsense | opencv | file
    file: null                   # only with source = file (relative to the cwd)
    min_views_warn: 10           # warning below this number of valid views (opencv)

  hand_eye:
    method:            PARK      # PARK | TSAI | HORAUD | ANDREFF | DANIILIDIS
    outlier_sigma:     0.5       # outlier threshold: median + sigma*std (lower = stricter)
    max_reproj_err_px: 0.4       # views with mean PnP reprojection error above it are EXCLUDED
    only_images: []              # optional subset, e.g. ["img0001.png"]; empty = all

  acquisition:
    n_calib_target: 30           # stop after this many saved views (re-run: numbering continues)
    n_val_target:   20
    preview_margin_px: 60        # guide rectangle in the live preview

  validation:
    save_overlay: true           # observed (green) vs predicted (red) corners

  # Colour sensor during the calibration views only.
  camera:
    frame_timeout_ms: 10000
    auto_exposure: false         # false = manual exposure/gain (stable corners between frames)
    exposure: 120
    gain: 16
    auto_white_balance: true     # set false ONLY together with a tuned white_balance
    white_balance: null          # kelvin, used only if auto_white_balance = false



# =============================================================================
# VISION (MASt3R-SfM + ArUco)
# =============================================================================
vision:
  input:
    # null → derived from sample_name:
    #   rgb_dir           = DATA/input_vision/<sample>[_<device>]/rgb
    #                       (or the sample folder itself if it holds images)
    #   pose_dir          = DATA/input_vision/<sample>[_<device>]/poses
    #   camera_params_dir = DATA/input_vision/<sample>[_<device>]/camera_parameters
    # pose_dir and camera_params_dir are only filled in if the folder exists.
    rgb_dir:           null
    pose_dir:          null
    camera_params_dir: null

  output:
    # null → RESULTS/<dd-mm-yyyy>/<sample>, with run_name "vision", i.e.
    #        RESULTS/<dd-mm-yyyy>/<sample>/vision/
    root:                        null
    run_name:                    null
    update_most_recent_symlink:  false
    z_axis_points_down:          true
    # Replace an existing run folder instead of suffixing it _01, _02, ...
    # Keep this true: the next stage reads the mesh from the un-suffixed path.
    overwrite_existing_run:      true
    # Delete the large intermediate .mast3r_sfm_cache/ when the run finishes.
    clean_sfm_cache:             true

  aruco:
    # Case-insensitive; normalized to lowercase. Registration inherits it.
    dictionary:             4x4_50
    # PHYSICAL marker edge length in MILLIMETRES. Single source of truth for
    # the whole pipeline (acquisition bootstrap/servo included) — this sets the metric scale of the reconstruction,
    # and registration inherits it. Measure it properly.
    marker_edge_length_mm:  25
    origin_marker_id:       null
    min_views_per_marker:   2
    align_to_aruco:         true
    max_sim3_scale_deviation_when_poses_known: 0.05
    detection_draw_scale:   2.0
    bundle_adjustment:      false
    ba_max_iters:           1000
    ba_lr:                  0.005
    ba_huber_delta_px:      2.0
    ba_cam_prior_sigma_m:   0.10
    ba_cam_prior_sigma_deg: 5.0
    reject_views_by_alignment_error: false
    max_view_alignment_reproj_rmse_px: 15.0
    min_kept_views: 2
    reject_views_with_no_markers: false

  surface:
    grid_step: 0.0
    fill_iters: 2
    smooth_iters: 2
    min_neighbors: 3
    max_resolution: 3072

  mast3r:
    # Hugging Face repo id (downloaded on first run) or a local .pth path.
    model_name: naver/MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric
    pipeline_variant: sfm
    scene_graph: auto
    # Only needed when scene_graph contains "retrieval".
    retrieval_model: null
    sfm_subsample: 4
    sfm_lr1: 0.07
    sfm_niter1: 300
    sfm_lr2: 0.01
    sfm_niter2: 300
    sfm_opt_depth: true
    sfm_shared_intrinsics: true
    sfm_matching_conf_thr: 5.0
    sfm_min_conf_thr: 1.5
    sfm_clean_depth: true
    image_size: 512
    neighbor_window: 2
    desc_conf_thr: 0.1
    dense_conf_thr: 12.0
    voxel_size: 0.0012
    max_points: 2000000
    pixel_tol: 1.5
    max_matches_per_pair: 50000
    pose_refine_iters: 1
    pose_refine_lr: 0.0
    pose_refine_lr_min: 1.0e-05
    pose_prior_sigma_deg: 1.0
    pose_prior_sigma_m: 0.01
    pose_prior_weight: 0.06
    pose_refine_max_drot_deg: 8.0
    pose_refine_max_dt_m: 0.06
    dense_refine_iters: 1
    dense_refine_lr: 0.0
    confidence_percentile: 99.0

  rerun:
    # true -> record the run to RESULTS/<dd-mm-yyyy>/<sample>/vision/rerun/spectra.rrd
    # (open it later with `rerun spectra.rrd`). Safe on SLURM: no viewer needed.
    enabled: false
    # true ONLY with a Rerun viewer running on this machine (live streaming on
    # grpc_port). Keep false on Mufasa.
    live_viewer: false
    grpc_port: 9876
    no_wait: false          # live_viewer only: do not wait for Enter at the end
    log_cloud_rgb: true
    log_cloud_confidence: true
    log_cameras: true
    log_camera_aruco_images: true
    log_camera_confidence_images: true
    log_aruco_3d: true
    log_surface_mesh: true
    log_surface_cloud_open3d_web: false
    open3d_web_visualizer_port: 8888
    open3d_web_show_ui: false
    pointcloud_resample_factor: 0.25
    save_rrd: true
    save_rbl: true
    rerun_subdir: rerun
    rrd_basename: spectra.rrd
    rbl_basename: spectra.rbl






# =============================================================================
# REGISTRATION (HSI → mesh)
# =============================================================================
registration:
  # Execution mode.
  #   single : standard pipeline — ArUcos visible in the HSI cube itself
  #   roi    : dual HSI — LiveView PNG with ArUcos + ROI cube without them
  #   batch  : every sample under DATA/input_registration/
  #   sweep  : one run per (res_reg, res_pc) pair, best pair kept
  mode: "sweep"

  # null → derived from sample_name + results_date:
  #   hsi_hdr      = DATA/input_registration/<sample>/<sample>_raw.hdr
  #   liveview_png = DATA/input_registration/<sample>/<sample>_raw.png  (ROI only)
  #   mesh         = RESULTS/<dd-mm-yyyy>/<sample>/vision/surface_mesh.ply
  #   aruco_json   = RESULTS/<dd-mm-yyyy>/<sample>/vision/aruco_markers_3d.json
  #   output_dir   = RESULTS/<dd-mm-yyyy>/<sample>/registration
  #
  # mesh / aruco_json fall back to the most recent dated vision run when the
  # current date has none, so registration-only runs keep working.
  paths:
    hsi_hdr:      null
    mesh:         null
    aruco_json:   null
    liveview_png: null
    output_dir:   null

  detection:
    hsi_extraction_method: "mean"     # "mean" | "visible_band" | "pca"
    # Both of these are INHERITED from vision.aruco when null. Set them only
    # to deliberately override — they describe the same physical markers.
    aruco_dict:            null       # null → vision.aruco.dictionary
    marker_edge_length_mm: null       # null → vision.aruco.marker_edge_length_mm
    use_subpix:            true
    subpix_winsize:        2
    equalize_method:       "clahe"    # "global" | "clahe" | "none"
    tune_detector:         true       # permissive DetectorParameters

  roi:
    method:         "sift"
    min_matches:    20
    ransac_thresh:  3.0
    lowe_ratio:     0.75
    fallback_orb:   true
    save_match_viz: true

  render:
    resolution_mm_per_px:     0.5   # final mesh / point-cloud resolution
    resolution_reg_mm_per_px: 1.0   # resolution used for registration only
    margin_mm:                10.0

  pointcloud:
    border_px:        2
    reflectance_norm: true
    pc_chunk_size:    100000

  export:
    # All false writes diagnostics only — no point cloud on disk.
    save_pointcloud: true
    ply:             true
    npy:             true
    csv:             false
    csv_max_points:  500000
    save_images:     true

  # Spectral Rerun recording, written right after the point-cloud export (needs
  # export.save_pointcloud + ply or npy). It lands next to the point cloud:
  #   RESULTS/<dd-mm-yyyy>/<sample>/registration/spectral.rrd (+ spectral.rbl)
  # Open it with `rerun spectral.rrd spectral.rbl`.
  #   top view    : one band — pick it on the `wavelength_nm` timeline (time panel)
  #   bottom view : PCA, first principal component only
  # Both views spin around the sample. Weight ≈ max_points x bands/band_step x
  # 4 bytes (150000 points, 290 bands, step 2 → ~90 MB raw, ~45 MB on disk).
  # Works in every mode (single / roi / batch / sweep's best pair).
  rerun:
    enabled:         true
    max_points:      150000     # random subset of the cloud; null = all (heavy)
    band_step:       2          # 1 = every band, 2 = every other band, ...
    colormap:        "viridis"  # viridis | turbo | inferno | magma | plasma | cividis | jet
    point_radius_px: 2.0        # point size on screen
    spin_speed:      0.3        # auto-spin speed of both views; 0 = still
    save_rbl:        true       # also write the layout alone (.rbl)
    rrd_basename:    "spectral.rrd"
    rbl_basename:    "spectral.rbl"

  # ------------------------------------------------------------------
  # mode == "batch"
  # Scans DATA/input_registration/<sample>/<sample>_raw.hdr. Mesh + ArUco come
  # from RESULTS/<dd-mm-yyyy>/<sample>/vision/. Aggregate Excel lands in
  # RESULTS/<dd-mm-yyyy>/_batch/batch_summary.xlsx.
  # ------------------------------------------------------------------
  batch:
    roi_mode:        false   # true → look for <sample>_raw.png next to the .hdr
    # Optional regex filter on sample folder names (e.g. "^SB\\d+").
    sample_regex:    null

  # ------------------------------------------------------------------
  # mode == "sweep"
  # Each [res_reg, res_pc] pair in mm/px. The winning pair is re-run into
  # registration/ so the final artifacts belong to it.
  # ------------------------------------------------------------------
  sweep:
    roi_mode: false
    resolution_pairs:
      - [5.0, 0.5]
      - [2.0, 0.5]
      - [1.0, 0.5]
      - [0.5, 0.5]
      - [0.2, 0.5]
